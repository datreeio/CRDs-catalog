name: Update index.yaml
on:
  schedule:
    - cron: '25 2 * * *'
jobs:
  update_index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
  
    - name: Pull latest changes
      run: git pull origin main
    
    - name: Run auto-update script
      run: python Utilities/auto-update-index.py . index.yaml
      
    - name: Commit index.yaml
      uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
      with:
        commit_message: Updating index.yaml
        file_pattern: index.yaml
